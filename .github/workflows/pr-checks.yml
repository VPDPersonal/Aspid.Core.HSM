name: PR checks

# pull_request_target: runs the base branch's copy with a write token, so labels work on fork PRs too.
# It never checks out the PR's code — everything below reads the PR through the API only.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Conventional Commits title with a known scope; sets the type, breaking-change and area labels.
  # Keep TYPES and SCOPES in sync with .claude/asp-pr.md.
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const TYPES = {
              feat: 'type: feature', fix: 'type: fix', perf: 'type: performance', refactor: 'type: refactor',
              docs: 'type: documentation', test: 'type: test', chore: 'type: chore', ci: 'type: ci', style: 'type: style',
            };
            const SCOPES = [
              // code
              'hsm', 'unity', 'generator', 'samples', 'tests', 'package',
              // repository
              'readme', 'changelog', 'release', 'github', 'claude', 'deps',
            ];
            // A file can add several areas.
            const PKG = 'Aspid.Core.HSM/Assets/Plugins/Aspid/Core/HSM/';
            const AREAS = [
              [PKG + 'Source/', 'area: runtime'],
              [PKG + 'Unity/Runtime/', 'area: runtime'],
              [PKG + 'Samples~/', 'area: samples'],
              [PKG + 'package.json', 'area: package'],
              [PKG + 'Aspid.Core.HSM.Generators.dll', 'area: generator'],
              ['Aspid.Core.HSM/Assets/_Scripts/', 'area: samples'],
              ['Aspid.Core.HSM.Generators/', 'area: generator'],
              ['global.json', 'area: generator'],
              ['README', 'area: docs'],
              ['CHANGELOG', 'area: docs'],
              ['docs/', 'area: docs'],
              ['.claude/', 'area: claude'],
              ['CLAUDE.md', 'area: claude'],
              ['.github/', 'area: ci'],
              ['scripts/', 'area: ci'],
            ];

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const title = pr.title;
            const errors = [];

            const m = /^([a-z]+)(?:\(([a-z0-9-]+)\))?(!)?: (.+)$/.exec(title);
            if (!m) errors.push('Title must be `type(scope): summary` (Conventional Commits).');
            else {
              const [, type, scope, , summary] = m;
              if (!TYPES[type]) errors.push(`Unknown type \`${type}\`; use one of: ${Object.keys(TYPES).join(', ')}.`);
              if (scope && !SCOPES.includes(scope)) errors.push(`Unknown scope \`${scope}\`; use one of: ${SCOPES.join(', ')} (or none).`);
              if (/\.$/.test(summary)) errors.push('Summary has no trailing period.');
            }
            if (title.length > 72) errors.push(`Title is ${title.length} characters; keep it within 72.`);

            // Labels are updated even when the title fails, so a later fix only has to touch the title.
            const current = pr.labels.map(l => l.name);
            const add = new Set();
            const remove = new Set();
            if (m && TYPES[m[1]]) {
              add.add(TYPES[m[1]]);
              current.filter(l => l.startsWith('type: ') && l !== TYPES[m[1]]).forEach(l => remove.add(l));
            }
            if (m?.[3]) add.add('breaking-change');

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
            for (const { filename } of files)
              for (const [prefix, label] of AREAS)
                if (filename.startsWith(prefix)) add.add(label);

            const toAdd = [...add].filter(l => !current.includes(l));
            if (toAdd.length) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: toAdd });
            for (const name of remove)
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name }).catch(() => {});

            if (errors.length) core.setFailed(errors.join('\n'));
