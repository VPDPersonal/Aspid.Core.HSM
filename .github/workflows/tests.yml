name: Tests

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs every test on the commit it publishes; there the Unity tests may not be skipped.
  workflow_call:
    inputs:
      require-unity:
        description: 'Fail instead of skipping the Unity tests when the Unity account secrets are unavailable.'
        type: boolean
        default: false
    secrets:
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false

permissions:
  contents: read

# Under workflow_call, github.workflow is the caller's name, so a release never cancels the run on main.
# Only PR runs cancel each other; every commit on main keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet-tests:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The Tests project only: the Sample project takes UnityEngine from a local Unity install.
      - name: Run generator and runtime tests
        run: dotnet test Aspid.Core.HSM.Generators/Aspid.Core.HSM.Generators/Aspid.Core.HSM.Generators.Tests --nologo

  # Unity compiles the package as C# 9 against .NET Standard 2.1; the tests use the latest C#.
  runtime-csharp9:
    name: Runtime as C# 9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Compile the runtime as Unity does
        run: dotnet build Aspid.Core.HSM.Generators/Aspid.Core.HSM.Generators/Aspid.Core.HSM.Runtime --nologo

  checks:
    name: Package and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the package
        run: node scripts/check-package.mjs

      - name: Check SKILL.md frontmatter
        run: |
          npm install --no-save --no-audit --no-fund js-yaml@4
          node scripts/check-skills.mjs

  # Runs the Unity tests only for a change that can affect them and only with a license to run them.
  # Secrets are unavailable to fork PRs and until the owner adds them; the Unity tests are then skipped, not failed,
  # except under require-unity.
  # Secrets: UNITY_EMAIL and UNITY_PASSWORD of a Unity account with a Personal license; GameCI activates a seat with
  # them in each job. Do not add the .ulf from Unity Hub (UNITY_LICENSE): it is bound to the Hub machine, and on
  # 6000.0.53f1 GameCI keeps retrying it instead of falling back to the account (seen in Aspid.FastTools).
  unity-plan:
    name: Unity plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - id: plan
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          REQUIRE_UNITY: ${{ inputs.require-unity }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          # What the Unity job reads: the package except its Markdown, and its own setup.
          relevant='^(Aspid\.Core\.HSM/Assets/Plugins/Aspid/Core/HSM/|scripts/make-unity-test-project\.sh$|\.github/workflows/tests\.yml$)'

          # "all" when the changed files are unknown: a release, a new branch, a failed API call, a truncated list.
          files=all
          if [ "$REQUIRE_UNITY" != true ]; then
            if [ "$EVENT" = pull_request ]; then
              files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')" || files=all
            elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ]; then
              # The compare API lists at most 300 files.
              files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')" || files=all
              [ "$(wc -l <<<"$files")" -lt 300 ] || files=all
            fi
          fi

          code="$(grep -vE '\.md(\.meta)?$' <<<"$files" || true)"
          if [ "$files" != all ] && ! grep -qE "$relevant" <<<"$code"; then
            echo "No change reaches the Unity tests; they are skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            if [ "$REQUIRE_UNITY" = true ]; then
              echo "::error::UNITY_EMAIL or UNITY_PASSWORD is not available; the Unity EditMode tests must run here."
              exit 1
            fi
            echo "::notice::UNITY_EMAIL or UNITY_PASSWORD is not available; the Unity EditMode tests are skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Compiles the package and its Game Loop sample in a throwaway project on the minimum Unity that package.json
  # promises, and runs the EditMode tests there. Only the minimum is checked: the dev project covers the newest.
  # The version needs a GameCI image (unityci/editor).
  unity-tests:
    name: Unity EditMode (minimum)
    needs: unity-plan
    if: needs.unity-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      UNITY: 6000.0.53f1
    steps:
      - uses: actions/checkout@v7

      - name: Create the test project
        run: scripts/make-unity-test-project.sh ci-unity-project "$UNITY"

      - uses: actions/cache@v6
        with:
          path: ci-unity-project/Library
          key: unity-library-${{ env.UNITY }}-${{ hashFiles('Aspid.Core.HSM/Assets/Plugins/Aspid/Core/HSM/**') }}
          restore-keys: unity-library-${{ env.UNITY }}-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY }}
          projectPath: ci-unity-project
          testMode: editmode
          artifactsPath: unity-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode results (${{ env.UNITY }})

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unity-test-results-${{ env.UNITY }}
          path: unity-test-results

  # The one Unity check that the main ruleset can require. A skipped job reports nothing useful,
  # so a required "Unity EditMode" check would wait forever; this job always reports.
  unity:
    name: Unity
    needs: [unity-plan, unity-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.unity-plan.result }}
          RUN: ${{ needs.unity-plan.outputs.run }}
          TESTS: ${{ needs.unity-tests.result }}
        run: |
          if [ "$PLAN" != success ]; then
            echo "::error::Unity plan: $PLAN."
            exit 1
          fi
          if [ "$RUN" = true ] && [ "$TESTS" != success ]; then
            echo "::error::Unity EditMode: $TESTS."
            exit 1
          fi
          echo "Unity EditMode: $TESTS."
