name: Claude

# Manual @claude replies in PRs and issues only; automatic PR reviews are disabled.
# A requested review also leaves inline comments.
# Comments from bots are ignored, so Claude's own replies do not start it again.
#
# The mention job appends .github/claude-review.md to the system prompt.
# A step reads the file before the action switches to the PR branch:
# older PR branches may not have the file yet.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (Pro/Max subscription).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  mention:
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Read review rules
        id: rules
        run: |
          {
            echo 'text<<CLAUDE_RULES_EOF'
            cat .github/claude-review.md
            echo 'CLAUDE_RULES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        env:
          # The action reads this variable and appends it to the system prompt.
          APPEND_SYSTEM_PROMPT: ${{ steps.rules.outputs.text }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The inline comment tool lets a requested review put issues on their lines.
          # git diff and git fetch let Claude see what the PR changed against its base.
          # gh pr comment posts the verdict of a requested review as a new comment.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git fetch:*),Bash(gh pr comment:*)"
