# Weekly, one grouped PR, titled `chore(deps): …` so it passes the PR title check.
# NuGet is left out on purpose: Roslyn versions in the generator projects are pinned to what Unity ships.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
